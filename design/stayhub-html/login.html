<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayHub · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EB}
a{color:#7A5B2C}a:hover{color:#5A421E}
.nav-link{color:#D9D2C5;text-decoration:none}
.nav-link:hover{color:#FFFFFF}
.card{transition:box-shadow .2s, transform .2s}
.card:hover{box-shadow:0 18px 40px -18px rgba(23,20,15,.35);transform:translateY(-2px)}
.act{background:none;border:0;cursor:pointer;font:inherit;text-decoration:none}
.act:hover{text-decoration:underline}
.chip:hover{border-color:#A07A3E}
.row:hover{background:#FBF8F2}
summary{cursor:pointer}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #A07A3E;outline-offset:1px}
</style>
</head>
<body>
<div style="font-family: Inter, system-ui, sans-serif; color: #1E1A16; background: #17140F; min-height: 100vh">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #17140F">
<div style="flex: 1 1 520px; min-height: 420px; position: relative; display: flex; background-color: #2A251E; background-image: repeating-linear-gradient(135deg, rgba(201,163,101,0.06) 0 16px, transparent 16px 32px)">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #8A8073"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Foto principal · lobby o habitación</span></div>
<div style="position: relative; margin-top: auto; padding: 56px; display: flex; flex-direction: column; gap: 14px; max-width: 560px">
<span style="width: 48px; height: 2px; background: #C9A365"></span>
<p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 600; line-height: 1.1; color: #FFFFFF">Toda tu red de hoteles en un solo lugar.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #B9B0A2">Hoteles, habitaciones, huéspedes, reservas y reportes.</p>
</div>
</div>
<div style="flex: 1 1 440px; background: #F6F2EB; display: flex; align-items: center; justify-content: center; padding: 56px 24px">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 12px">
<a href="hoteles.html" style="text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 700; font-style: italic; color: #17140F; letter-spacing: 0.01em"><span style="color: #C9A365">Stay</span>Hub</a>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; line-height: 1.1">Bienvenido de nuevo</h1>
<p style="margin: 0; font-size: 15px; color: #6B6054">Inicia sesión para administrar tus hoteles.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 18px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Correo electrónico<input type="email" autocomplete="username" placeholder="admin@stayhub.com" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%; height: 50px; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Contraseña<span style="position: relative; display: block"><input type="password" autocomplete="current-password" placeholder="••••••••" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%; height: 50px; background: #FFFFFF; padding-right: 84px"><button type="button" style="position: absolute; right: 4px; top: 3px; height: 44px; padding: 0 14px; border: 0; background: transparent; color: #7A5B2C; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; cursor: pointer">Mostrar</button></span></label>
<a href="hoteles.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #17140F; color: #FFFFFF; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-decoration: none; margin-top: 8px">Ingresar</a>
</form>
<p style="margin: 0; font-size: 12px; color: #6B6054; text-align: center">StayHub · Panel de administración</p>
</div>
</div>
</div>
</div>
</body>
</html>
