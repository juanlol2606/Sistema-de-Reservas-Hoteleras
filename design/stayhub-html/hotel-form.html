<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayHub · Nuevo hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EB}
a{color:#7A5B2C}a:hover{color:#5A421E}
.nav-link{color:#D9D2C5;text-decoration:none}
.nav-link:hover{color:#FFFFFF}
.card{transition:box-shadow .2s, transform .2s}
.card:hover{box-shadow:0 18px 40px -18px rgba(23,20,15,.35);transform:translateY(-2px)}
.act{background:none;border:0;cursor:pointer;font:inherit;text-decoration:none}
.act:hover{text-decoration:underline}
.chip:hover{border-color:#A07A3E}
.row:hover{background:#FBF8F2}
summary{cursor:pointer}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #A07A3E;outline-offset:1px}
</style>
</head>
<body>
<div style="font-family: Inter, system-ui, sans-serif; color: #1E1A16; background: #3A332B; min-height: 100vh">
<div style="min-height: 100vh; background: rgba(23,20,15,.78); display: flex; align-items: flex-start; justify-content: center; padding: 64px 16px; box-sizing: border-box">
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="width: 100%; max-width: 760px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); overflow: hidden">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 28px 32px 20px; border-bottom: 1px solid #EFE8DC">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #7A5B2C">Hoteles</span><h2 id="dlg-title" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 600; line-height: 1.1">Nuevo hotel</h2><p style="margin: 0; font-size: 14px; color: #6B6054">Completa los datos y agrega fotos para mostrarlo en la red.</p></div>
<a href="hoteles.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #3A332B; background: #F4EFE7; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<form style="padding: 24px 32px; display: flex; flex-direction: column; gap: 20px">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px"><legend style="padding: 0; margin-bottom: 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1E1A16">Fotos del hotel</legend><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<div style="grid-column: span 2; position: relative"><div style="position: relative; aspect-ratio: 16 / 9; border-radius: 12px; background-color: #EDE6DA; background-image: repeating-linear-gradient(135deg, rgba(122,91,44,0.07) 0 12px, transparent 12px 24px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6B6054; overflow: hidden">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; text-align: center">Fachada o lobby</span>
<span style="position: absolute; top: 10px; left: 10px; background: #17140F; color: #E6C487; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px">Portada</span></div></div>
<div style="aspect-ratio: 1 / 1; border-radius: 12px; background-color: #EDE6DA; background-image: repeating-linear-gradient(135deg, rgba(122,91,44,0.07) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; color: #6B6054; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase">Foto 2</div><div style="aspect-ratio: 1 / 1; border-radius: 12px; background-color: #EDE6DA; background-image: repeating-linear-gradient(135deg, rgba(122,91,44,0.07) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; color: #6B6054; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase">Foto 3</div><div style="aspect-ratio: 1 / 1; border-radius: 12px; background-color: #EDE6DA; background-image: repeating-linear-gradient(135deg, rgba(122,91,44,0.07) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; color: #6B6054; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase">Foto 4</div>
<label style="aspect-ratio: 1 / 1; border: 2px dashed #CDBFA8; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #7A5B2C; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>Subir fotos<input type="file" accept="image/*" multiple style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
</div>
<p style="margin: 0; font-size: 12px; color: #6B6054">JPG o PNG, hasta 5 MB cada una. Arrastra para cambiar el orden; la primera es la portada.</p></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px"><legend style="padding: 0; margin-bottom: 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1E1A16">Información</legend><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 20px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Nombre<input type="text" placeholder="Ej. Casa Bahía" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Estrellas<select style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"><option>★★★</option><option>★</option><option>★★</option><option>★★★★</option><option>★★★★★</option></select></label></div><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Calle y número<input type="text" placeholder="Ej. Calle del Arsenal # 8-27" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 20px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Ciudad<input type="text" placeholder="Ej. Cartagena" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">País<input type="text" value="Colombia" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label></div></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px"><legend style="padding: 0; margin-bottom: 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #1E1A16">Contacto</legend><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 20px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Teléfono<input type="tel" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Correo de contacto<input type="email" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label></div></fieldset><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Servicios<input type="text" placeholder="wifi, piscina, desayuno" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"><span style="font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #6B6054">Separados por comas.</span></label><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px; font-weight: 500; cursor: pointer"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7A5B2C"><span>Hotel activo<span style="display: block; font-size: 12px; color: #6B6054; font-weight: 400">Recibe reservas</span></span></label>
</form>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; padding: 18px 32px; background: #FBF8F2; border-top: 1px solid #EFE8DC">
<a href="hoteles.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #DCD2C2; background: #FFFFFF; color: #1E1A16; font-size: 14px; font-weight: 500; text-decoration: none">Cancelar</a>
<a href="hoteles.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 999px; background: #C9A365; color: #17140F; font-size: 14px; font-weight: 600; text-decoration: none">Guardar hotel</a>
</div>
</div>
</div>
</div>
</body>
</html>
