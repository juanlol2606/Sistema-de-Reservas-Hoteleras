<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayHub · Nuevo huésped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EB}
a{color:#7A5B2C}a:hover{color:#5A421E}
.nav-link{color:#D9D2C5;text-decoration:none}
.nav-link:hover{color:#FFFFFF}
.card{transition:box-shadow .2s, transform .2s}
.card:hover{box-shadow:0 18px 40px -18px rgba(23,20,15,.35);transform:translateY(-2px)}
.act{background:none;border:0;cursor:pointer;font:inherit;text-decoration:none}
.act:hover{text-decoration:underline}
.chip:hover{border-color:#A07A3E}
.row:hover{background:#FBF8F2}
summary{cursor:pointer}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #A07A3E;outline-offset:1px}
</style>
</head>
<body>
<div style="font-family: Inter, system-ui, sans-serif; color: #1E1A16; background: #3A332B; min-height: 100vh">
<div style="min-height: 100vh; background: rgba(23,20,15,.78); display: flex; align-items: flex-start; justify-content: center; padding: 64px 16px; box-sizing: border-box">
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="width: 100%; max-width: 680px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); overflow: hidden">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 28px 32px 20px; border-bottom: 1px solid #EFE8DC">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #7A5B2C">Huéspedes</span><h2 id="dlg-title" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 600; line-height: 1.1">Nuevo huésped</h2><p style="margin: 0; font-size: 14px; color: #6B6054">Datos de la persona que reserva.</p></div>
<a href="huespedes.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #3A332B; background: #F4EFE7; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<form style="padding: 24px 32px; display: flex; flex-direction: column; gap: 20px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Nombre completo<input type="text" placeholder="Ej. Ana María Torres" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 20px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Correo electrónico<input type="email" placeholder="nombre@correo.com" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Teléfono<input type="tel" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 20px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Tipo de documento<select style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"><option>Cédula (CC)</option><option>Cédula de extranjería (CE)</option><option>Pasaporte (PA)</option></select></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Número de documento<input type="text" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 20px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6054">Ciudad de origen<input type="text" placeholder="Ej. Medellín" style="height: 44px; border: 1px solid #DCD2C2; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #1E1A16; background: #FBF9F5; box-sizing: border-box; width: 100%"></label><div style="display: flex; align-items: flex-end"><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px; font-weight: 500; cursor: pointer"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7A5B2C"><span>Huésped activo</span></label></div></div>
</form>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; padding: 18px 32px; background: #FBF8F2; border-top: 1px solid #EFE8DC">
<a href="huespedes.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #DCD2C2; background: #FFFFFF; color: #1E1A16; font-size: 14px; font-weight: 500; text-decoration: none">Cancelar</a>
<a href="huespedes.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 999px; background: #C9A365; color: #17140F; font-size: 14px; font-weight: 600; text-decoration: none">Guardar huésped</a>
</div>
</div>
</div>
</div>
</body>
</html>
